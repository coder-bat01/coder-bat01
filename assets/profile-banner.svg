<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Ajinkya — browser games and contact details</title>
  <desc id="desc">A playful browser game scene with email and LinkedIn contact details.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111c37"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#164e83"/>
      <stop offset="1" stop-color="#67c8d4"/>
    </linearGradient>
    <linearGradient id="bird" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#91a4c5" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <clipPath id="gameClip"><rect x="686" y="84" width="440" height="180" rx="0"/></clipPath>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#background)"/>
  <rect width="1200" height="320" rx="28" fill="url(#grid)"/>
  <circle cx="1010" cy="110" r="260" fill="#38bdf8" opacity=".08"/>
  <circle cx="1155" cy="280" r="190" fill="#8b5cf6" opacity=".09"/>

  <rect x="72" y="69" width="5" height="171" rx="2.5" fill="#67e8f9"/>
  <text x="100" y="126" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="1">AJINKYA</text>
  <text x="102" y="166" fill="#b8c6dc" font-family="Segoe UI, Arial, sans-serif" font-size="17" letter-spacing="2.2">BROWSER GAMES · INTERACTIVE WEB</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <circle cx="112" cy="211" r="14" fill="#172640" stroke="#334766"/>
    <path d="M104 206h16v11h-16zM104 207l8 6 8-6" fill="none" stroke="#67e8f9" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="137" y="216" fill="#d7e1ef" font-size="12.5">ajinkyadhakne1105@gmail.com</text>
    <rect x="98" y="235" width="28" height="28" rx="7" fill="#0a66c2"/>
    <text x="112" y="254" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">in</text>
    <text x="137" y="254" fill="#d7e1ef" font-size="12.5">linkedin.com/in/ajinkya17</text>
  </g>

  <!-- Browser window and playable game scene -->
  <rect x="666" y="43" width="480" height="235" rx="15" fill="#0a0f1b" stroke="#64748b" stroke-opacity=".65" stroke-width="2"/>
  <path d="M681 43h450a15 15 0 0 1 15 15v25H666V58a15 15 0 0 1 15-15Z" fill="#1a2435"/>
  <circle cx="688" cy="61" r="4" fill="#fb7185"/>
  <circle cx="703" cy="61" r="4" fill="#fbbf24"/>
  <circle cx="718" cy="61" r="4" fill="#34d399"/>
  <rect x="755" y="51" width="263" height="20" rx="10" fill="#0e1727"/>
  <text x="886" y="65" text-anchor="middle" fill="#9fb0c8" font-family="Segoe UI, Arial, sans-serif" font-size="10">flappy-power · browser game</text>

  <g clip-path="url(#gameClip)">
    <rect x="686" y="84" width="440" height="180" fill="url(#sky)"/>
    <circle cx="1075" cy="111" r="27" fill="#fde68a" opacity=".95"/>
    <g fill="#e0f2fe" opacity=".82">
      <ellipse cx="765" cy="116" rx="30" ry="9"/><circle cx="750" cy="110" r="11"/><circle cx="768" cy="106" r="15"/><circle cx="786" cy="113" r="10"/>
      <ellipse cx="971" cy="148" rx="23" ry="7"/><circle cx="960" cy="143" r="9"/><circle cx="975" cy="139" r="12"/><circle cx="989" cy="146" r="8"/>
    </g>
    <path d="M686 222 745 184l52 31 62-48 61 43 57-37 63 47 86-56v82H686Z" fill="#2d7480" opacity=".7"/>
    <path d="M686 234 752 205l57 23 74-41 56 39 77-35 58 33 52-25v65H686Z" fill="#235c68" opacity=".75"/>

    <!-- Flappy-style bird -->
    <g transform="translate(836 161) rotate(-8)">
      <ellipse cx="0" cy="0" rx="25" ry="19" fill="url(#bird)"/>
      <path d="M-12 2q13-16 24 0-11 14-24 5Z" fill="#fff7c2" opacity=".9"/>
      <circle cx="10" cy="-7" r="4" fill="#172033"/>
      <circle cx="11" cy="-8" r="1.3" fill="#fff"/>
      <path d="m22 0 17 6-17 6Z" fill="#fb7185"/>
    </g>

    <!-- Game pipes -->
    <g fill="#34d399" stroke="#13795b" stroke-width="2">
      <rect x="916" y="94" width="32" height="66" rx="4"/><rect x="909" y="153" width="46" height="15" rx="4"/>
      <rect x="916" y="209" width="32" height="58" rx="4"/><rect x="909" y="205" width="46" height="15" rx="4"/>
      <rect x="1011" y="84" width="32" height="48" rx="4"/><rect x="1004" y="125" width="46" height="15" rx="4"/>
      <rect x="1011" y="179" width="32" height="88" rx="4"/><rect x="1004" y="175" width="46" height="15" rx="4"/>
    </g>
    <rect x="686" y="252" width="440" height="16" fill="#4ade80"/>
    <path d="M686 261h440" stroke="#bbf7d0" stroke-opacity=".5" stroke-width="2" stroke-dasharray="12 10"/>
    <rect x="705" y="94" width="36" height="24" rx="8" fill="#0f172a" fill-opacity=".72"/>
    <text x="723" y="110" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">12</text>
  </g>

  <!-- 3D wireframe cube -->
  <g transform="translate(1081 112)" fill="none" stroke="#d8b4fe" stroke-width="2" opacity=".95">
    <path d="m0-21 22 12v25L0 29-22 16V-9Z"/>
    <path d="M0-21V4l22 12M0 4l-22 12M0 4l0 25"/>
  </g>
  <rect x="1062" y="145" width="53" height="18" rx="9" fill="#221a3b" stroke="#8b5cf6" stroke-opacity=".65"/>
  <text x="1088" y="158" text-anchor="middle" fill="#e9d5ff" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700">3D GAME WORLD</text>

  <!-- Browser game control card -->
  <rect x="585" y="214" width="190" height="70" rx="11" fill="#111827" stroke="#475569" stroke-width="1.5"/>
  <rect x="599" y="226" width="54" height="24" rx="6" fill="#1e293b" stroke="#64748b"/>
  <text x="626" y="242" text-anchor="middle" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700">SPACE</text>
  <text x="663" y="239" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700">FLAP</text>
  <text x="599" y="266" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="9">CLICK OR TAP TO FLY</text></svg>
